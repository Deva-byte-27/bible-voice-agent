<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Speech V2 - Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .glass {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            background-clip: text; -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
            display: inline-block;
            margin-right: 8px;
            transition: all 0.3s;
        }

        .status-dot.active {
            background: #00ff88;
            box-shadow: 0 0 12px #00ff88;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-text {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 32px;
        }

        .btn {
            padding: 14px 40px;
            border-radius: 50px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 8px;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-stop {
            background: rgba(255,255,255,0.08);
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .btn:hover { transform: scale(1.05); }

        .detected {
            margin-top: 32px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .detected h3 {
            font-size: 1.1rem;
            color: #667eea;
            margin-bottom: 8px;
        }

        .detected p {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
        }

        .display-link {
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.3);
        }

        .display-link a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="glass">
        <h1>✝ Bible Speech V2</h1>
        <p class="subtitle">AI-Powered Verse Detection</p>

        <div class="status-text">
            <span class="status-dot" id="dot"></span>
            <span id="statusText">Not Listening</span>
        </div>

        <div>
            <button class="btn btn-start" onclick="startListening()">🎙 Start</button>
            <button class="btn btn-stop" onclick="stopListening()">⏹ Stop</button>
        </div>

        <div class="detected">
            <h3 id="refText">No verse detected yet</h3>
            <p id="verseText">Start listening and speak a Bible reference...</p>
        </div>

        <div class="display-link">
            Congregation screen →
            <a href="/display" target="_blank">Open Display</a>
        </div>
    </div>

    <script>
        let polling = null;

        function startListening() {
            fetch('/start');
            document.getElementById('dot').classList.add('active');
            document.getElementById('statusText').textContent = 'Listening...';
            polling = setInterval(fetchVerse, 3000);
        }

        function stopListening() {
            fetch('/stop');
            document.getElementById('dot').classList.remove('active');
            document.getElementById('statusText').textContent = 'Not Listening';
            clearInterval(polling);
        }

        function fetchVerse() {
            fetch('/verse')
                .then(r => r.json())
                .then(data => {
                    if (data.reference) {
                        document.getElementById('refText').textContent = data.reference;
                        document.getElementById('verseText').textContent = data.text;
                    }
                });
        }
    </script>
</body>
</html>
